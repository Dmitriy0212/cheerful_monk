<section class="revius">
  <div class="container">
    <h2 class="revius__title">Відгуки клієнтів</h2>
    <h3 class="revius__subtitle">
      Дізнайтеся, що кажуть наші задоволені клієнти про нашу меблі.
    </h3>
    <div class="revius-slider">
      <ul class="swiper-wrapper sliderwrapper"></ul>
      <div class="buttons-box">
        <div class="swiper-pagination swiper-slide"></div>
        <div class="slider-btn">
          <button class="sliderArrows slider__btn sliderbtn--prev">
            <svg viewBox="0 0 32 32" width="24" height="24">
              <use href="/public/icon.svg#icon-left-arrow-alt"></use>
            </svg>
          </button>
          <button class="sliderArrows slider__btn sliderbtn--next">
            <svg viewBox="0 0 32 32" width="24" height="24">
              <use href="/public/icon.svg#icon-right-arrow-alt"></use>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
